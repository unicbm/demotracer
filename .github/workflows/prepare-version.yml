name: Prepare version PR

on:
  workflow_dispatch:
    inputs:
      gui_version:
        description: GUI x.y.z version (empty keeps current)
        type: string
      playback_version:
        description: Playback x.y.z version (empty keeps current)
        type: string
      converter_version:
        description: Converter x.y.z version (empty keeps current)
        type: string
      notes_zh:
        description: Chinese release notes (required when GUI changes)
        type: string
      notes_en:
        description: English release notes (required when GUI changes)
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-version
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'unicbm/demotracer' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          submodules: recursive
      - name: Prepare versions and supplied release notes
        env:
          GUI_VERSION: ${{ inputs.gui_version }}
          PLAYBACK_VERSION: ${{ inputs.playback_version }}
          CONVERTER_VERSION: ${{ inputs.converter_version }}
          RELEASE_NOTES_ZH: ${{ inputs.notes_zh }}
          RELEASE_NOTES_EN: ${{ inputs.notes_en }}
        run: node tooling/scripts/prepare-version.mjs
      - name: Check release contract
        run: tooling/scripts/check-release-contract.ps1
      - run: git diff --check
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        id: version-pr
        with:
          branch: codex/prepare-version
          title: 'chore: prepare product versions'
          commit-message: 'chore: prepare product versions'
          body: |
            Updates the selected GUI, Playback and converter versions.
            Review the supplied release notes and CI before merging.
            After merging, run Release NSIS on main with publish enabled.
          add-paths: |
            desktop/gui/package.json
            desktop/gui/src-tauri/Cargo.toml
            desktop/gui/src-tauri/Cargo.lock
            desktop/gui/src-tauri/tauri.conf.json
            desktop/converter/Cargo.toml
            desktop/converter/Cargo.lock
            shared/contracts/telemetry-contract.v1.json
            server/plugins/DemoTracer/src/DemoTracer/Lifecycle/DemoTracerPlugin.cs
            tooling/release/release-notes.v*.json
            tooling/release/github-release.v*.md
      # PRs created with GITHUB_TOKEN do not automatically trigger pull_request CI.
      - name: Validate the bot version branch
        if: steps.version-pr.outputs.pull-request-operation == 'created' || steps.version-pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref codex/prepare-version
