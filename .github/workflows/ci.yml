name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          submodules: recursive
      - name: Check recursive component pins
        run: node .deps/common/tools/check-components.mjs
      - name: Check source whitespace
        run: git show --check --format= HEAD
      - name: Check recursive private-source hygiene
        shell: pwsh
        run: |
          $privateFiles = @(git grep --recurse-submodules -I -l -i -E 'C:\\Users\\|-----BEGIN ([A-Z0-9]+ )*PRIVATE KEY-----' -- .)
          $scanExit = $LASTEXITCODE
          if ($scanExit -eq 1) { exit 0 }
          if ($scanExit -ne 0) { exit $scanExit }
          Write-Error ("Private source data detected in tracked files: " + ($privateFiles -join ', '))
          exit 1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Validate component
        shell: pwsh
        run: tools/check.ps1
