name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      full:
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_FULL: ${{ inputs.full || false }}
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  gate:
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      parser: ${{ steps.scope.outputs.parser }}
      converter: ${{ steps.scope.outputs.converter }}
      desktop: ${{ steps.scope.outputs.desktop }}
      frontend: ${{ steps.scope.outputs.frontend }}
      playback: ${{ steps.scope.outputs.playback }}
      nativeCommon: ${{ steps.scope.outputs.nativeCommon }}
      fuzz: ${{ steps.scope.outputs.fuzz }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Select affected checks
        id: scope
        run: node tooling/scripts/ci-scope.mjs

      - name: Test CI impact selection
        run: node --test tooling/scripts/ci-scope.test.mjs

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check converter formatting
        working-directory: desktop/converter
        run: cargo fmt --check

      - name: Check desktop Rust formatting
        working-directory: desktop/gui/src-tauri
        run: cargo fmt --check

      - name: Check source ownership and parser pin
        run: node tooling/scripts/check-source-layout.mjs --require-checkout

      - name: Check release contract
        shell: pwsh
        run: tooling\scripts\check-release-contract.ps1

      - name: Check public-source hygiene
        shell: pwsh
        run: |
          $forbiddenTracked = git ls-files --recurse-submodules |
            Where-Object {
              $_ -match '(^|/)(target|bin|obj|tmp|output)(/|$)' -or
              $_ -match '\.(dem|dtr|cs2rec|log)$'
            }
          if ($forbiddenTracked) {
            Write-Error "tracked generated/private artifacts are not allowed:`n$($forbiddenTracked -join "`n")"
            exit 1
          }

          $browserTargetDir = Join-Path "desktop\converter" ("wa" + "sm")
          if (Test-Path $browserTargetDir) {
            Write-Error "unexpected browser-target converter directory: $browserTargetDir"
            exit 1
          }

          $hits = git grep -n -E 'C:\\Users\\|[Ww][Aa][Ss][Mm]|[Cc]urrent writer format is `\.dtr` v4' -- . ':!desktop/converter/Cargo.lock' ':!desktop/gui/src-tauri/Cargo.lock' ':!desktop/gui/pnpm-lock.yaml' ':!cloudflare/telemetry/pnpm-lock.yaml'
          if ($LASTEXITCODE -eq 1) {
            exit 0
          }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $hits
          exit 1

      - name: Check recursive private-source hygiene
        shell: pwsh
        run: |
          $privateFiles = @(git grep --recurse-submodules -I -l -i -E 'C:\\Users\\|-----BEGIN ([A-Z0-9]+ )*PRIVATE KEY-----' -- .)
          $scanExit = $LASTEXITCODE
          if ($scanExit -eq 1) { exit 0 }
          if ($scanExit -ne 0) { exit $scanExit }
          Write-Error ("Private source data detected in tracked files: " + ($privateFiles -join ', '))
          exit 1

      - name: Check commit whitespace
        run: git show --check --format= HEAD

  converter:
    needs: gate
    if: ${{ needs.gate.outputs.converter == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore converter Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/converter -> target
          shared-key: converter
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test converter
        working-directory: desktop/converter
        shell: pwsh
        run: tools/check.ps1

  frontend:
    needs: gate
    if: ${{ needs.gate.outputs.frontend == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read professional identity source pin
        id: pro-steamid-source
        shell: pwsh
        run: |
          $source = Get-Content desktop\gui\pro-steamid-catalog-source.json -Raw | ConvertFrom-Json
          "commit=$($source.commit)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Checkout professional identity source
        uses: actions/checkout@v7
        with:
          repository: unicbm/CS2-pro-steamid-lib
          ref: ${{ steps.pro-steamid-source.outputs.commit }}
          path: .external/CS2-pro-steamid-lib

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/gui/pnpm-lock.yaml

      - name: Install pinned cs2-lib data dependency
        working-directory: server/runtime/common/tools/cs2-lib-data
        run: npm.cmd ci --ignore-scripts

      - name: Check generated cs2-lib econ projection
        working-directory: server/runtime/common/tools/cs2-lib-data
        run: |
          npm.cmd run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd test

      - name: Install desktop dependencies
        working-directory: desktop/gui
        run: pnpm install --frozen-lockfile

      - name: Generate professional identity snapshot
        run: node desktop\gui\scripts\import-pro-steamid-catalog.mjs .external\CS2-pro-steamid-lib

      - name: Check desktop frontend
        working-directory: desktop/gui
        run: pnpm run check

      - name: Test desktop frontend state
        working-directory: desktop/gui
        run: pnpm test

      - name: Build desktop frontend
        working-directory: desktop/gui
        run: pnpm run build:vite

  desktop-rust:
    needs: gate
    if: ${{ needs.gate.outputs.desktop == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore desktop Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/gui/src-tauri -> target
          shared-key: desktop-debug
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test desktop Rust backend
        working-directory: desktop/gui/src-tauri
        run: cargo test --locked

  css:
    needs: gate
    if: ${{ needs.gate.outputs.playback == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore NuGet cache
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('server/**/*.csproj', 'server/**/*.props', 'server/**/*.targets') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Build and test CSS plugin
        shell: pwsh
        run: tooling\scripts\test-css.ps1 -SkipRandomizer

      - name: Stage tested managed binaries
        shell: pwsh
        run: tooling/scripts/save-managed-artifacts.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: managed-playback
          path: tmp/ci-managed/
          if-no-files-found: error

  randomizer-standalone:
    needs: gate
    if: ${{ needs.gate.outputs.playback == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Test and package maintained Randomizer
        shell: pwsh
        run: |
          server/runtime/BotRandomizer/tools/check.ps1
          server/runtime/BotRandomizer/tools/package.ps1 -SkipBuild
          server/runtime/BotRandomizer/tools/test-package.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: randomizer-package
          path: |
            server/runtime/BotRandomizer/dist/BotRandomizer-v*.zip
            server/runtime/BotRandomizer/dist/BotRandomizer-v*.zip.sha256
          if-no-files-found: error

  native-windows:
    needs: gate
    if: ${{ needs.gate.outputs.nativeCommon == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read shared hook source pin
        id: metamod-source
        shell: pwsh
        run: |
          $contract = Get-Content shared\contracts\playback-contract.v1.json -Raw | ConvertFrom-Json
          "commit=$($contract.hook_runtime.metamod_source_commit)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Checkout shared hook engine
        uses: actions/checkout@v7
        with:
          repository: alliedmodders/metamod-source
          ref: ${{ steps.metamod-source.outputs.commit }}
          path: .external/metamod-khook
          submodules: recursive

      - name: Configure shared hook integration tests
        env:
          MMSOURCE_DEV: ${{ github.workspace }}/.external/metamod-khook
        run: cmake -S server\runtime\common\native\tests -B server\runtime\common\native\tests\build -A x64

      - name: Build shared hook integration tests
        run: cmake --build server\runtime\common\native\tests\build --config Release

      - name: Test shared hook chain and lifecycle
        run: ctest --test-dir server\runtime\common\native\tests\build -C Release --output-on-failure

  native-fuzz-smoke:
    needs: gate
    if: ${{ needs.gate.outputs.fuzz == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure production replay ABI fuzz target
        run: >-
          cmake -S server/runtime/BotController/tests
          -B server/runtime/BotController/out/replay-abi-fuzz-ci
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER=clang++
          -DBOTCONTROLLER_BUILD_FUZZER=ON

      - name: Build native replay tests and fuzz target
        run: cmake --build server/runtime/BotController/out/replay-abi-fuzz-ci --config RelWithDebInfo

      - name: Test native replay safety under Clang
        run: >-
          ctest --test-dir server/runtime/BotController/out/replay-abi-fuzz-ci
          --output-on-failure

      - name: Smoke fuzz production replay ABI validator
        timeout-minutes: 2
        run: >-
          server/runtime/BotController/out/replay-abi-fuzz-ci/BotControllerReplayAbiFuzz
          -runs=2000
          -max_len=4096
          -rss_limit_mb=1024
          -print_final_stats=1

  parser:
    needs: gate
    if: ${{ needs.gate.outputs.parser == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: third_party/demoparser -> target
      - name: Check maintained parser and fixture-test compilation
        shell: pwsh
        run: third_party/demoparser/tools/check.ps1

  native-products:
    needs: gate
    if: ${{ needs.gate.outputs.playback == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      matrix:
        component: [BotController]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Read toolchain pins
        id: native
        shell: pwsh
        run: |
          & server/runtime/common/tools/check-native-toolchain.ps1
          $hooks = Get-Content server/runtime/common/contracts/hook-runtime.v1.json -Raw | ConvertFrom-Json
          $sdk = Get-Content server/runtime/common/contracts/native-toolchain.v1.json -Raw | ConvertFrom-Json
          "metamod=$($hooks.metamod_source_commit)" >> $env:GITHUB_OUTPUT
          "sdk=$($sdk.hl2sdk_commit)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v7
        with:
          repository: alliedmodders/metamod-source
          ref: ${{ steps.native.outputs.metamod }}
          path: .external/metamod-khook
          submodules: recursive
      - uses: actions/checkout@v7
        with:
          repository: alliedmodders/hl2sdk
          ref: ${{ steps.native.outputs.sdk }}
          path: .external/hl2sdk
      - name: Test and build full native DLL
        shell: pwsh
        env:
          MMSOURCE_DEV: ${{ github.workspace }}/.external/metamod-khook
          HL2SDKCS2: ${{ github.workspace }}/.external/hl2sdk
          PROTOC: ${{ github.workspace }}/.external/hl2sdk/devtools/bin/protoc.exe
        run: server/runtime/${{ matrix.component }}/tools/check.ps1 -NativeBuild -SkipManagedBuild

      - name: Save native package for product integration
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.component }}
          path: server/runtime/${{ matrix.component }}/.build/native/package/
          if-no-files-found: error

  playback-package:
    needs: [gate, css, randomizer-standalone, native-products]
    if: ${{ needs.gate.outputs.playback == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: native-BotController
          path: server/runtime/BotController/build/package
      - uses: actions/download-artifact@v8
        with:
          name: managed-playback
          path: .
      - uses: actions/download-artifact@v8
        with:
          name: randomizer-package
          path: dist/randomizer
      - name: Assemble matched playback bundle and source manifest
        shell: pwsh
        run: |
          $plugin = Get-Content server/plugins/DemoTracer/src/DemoTracer/Lifecycle/DemoTracerPlugin.cs -Raw
          $version = [regex]::Match($plugin, 'ModuleVersion\s*=>\s*"([^"]+)"').Groups[1].Value
          if (-not $version) { throw 'Playback version not found' }
          $contract = Get-Content shared/contracts/playback-contract.v1.json -Raw | ConvertFrom-Json
          tooling/scripts/package-server.ps1 -Version $version -SkipCssBuild -BotRandomizerPackage "dist/randomizer/BotRandomizer-v$($contract.bot_randomizer.provider_version).zip"
      - uses: actions/upload-artifact@v7
        with:
          name: demotracer-playback-windows-x64
          path: dist/demotracer-css-v*.zip
          if-no-files-found: error

  validate:
    name: validate
    if: ${{ always() }}
    needs:
      - gate
      - parser
      - native-products
      - playback-package
      - converter
      - frontend
      - desktop-rust
      - css
      - randomizer-standalone
      - native-windows
      - native-fuzz-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Require selected checks to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const n=JSON.parse(process.env.RESULTS); if(n.gate.result!=="success" || Object.values(n).some(x=>!["success","skipped"].includes(x.result))) process.exit(1)'
