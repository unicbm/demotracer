name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  gate:
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check converter formatting
        working-directory: desktop/converter
        run: cargo fmt --check

      - name: Check desktop Rust formatting
        working-directory: desktop/gui/src-tauri
        run: cargo fmt --check

      - name: Check release contract
        shell: pwsh
        run: tooling\scripts\check-release-contract.ps1

      - name: Check public-source hygiene
        shell: pwsh
        run: |
          $forbiddenTracked = git ls-files |
            Where-Object {
              $_ -match '(^|/)(target|bin|obj|tmp|output)(/|$)' -or
              $_ -match '\.(dem|dtr|cs2rec|log)$'
            }
          if ($forbiddenTracked) {
            Write-Error "tracked generated/private artifacts are not allowed:`n$($forbiddenTracked -join "`n")"
            exit 1
          }

          $browserTargetDir = Join-Path "desktop\converter" ("wa" + "sm")
          if (Test-Path $browserTargetDir) {
            Write-Error "unexpected browser-target converter directory: $browserTargetDir"
            exit 1
          }

          $hits = git grep -n -E 'C:\\Users\\|[Ww][Aa][Ss][Mm]|[Cc]urrent writer format is `\.dtr` v4' -- . ':!desktop/converter/Cargo.lock' ':!desktop/gui/src-tauri/Cargo.lock' ':!desktop/gui/pnpm-lock.yaml' ':!cloudflare/telemetry/pnpm-lock.yaml'
          if ($LASTEXITCODE -eq 1) {
            exit 0
          }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $hits
          exit 1

      - name: Check commit whitespace
        run: git show --check --format= HEAD

  converter:
    needs: gate
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore converter Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: desktop/converter -> target
          shared-key: converter
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test converter
        working-directory: desktop/converter
        run: cargo test --locked

  frontend:
    needs: gate
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read professional identity source pin
        id: pro-steamid-source
        shell: pwsh
        run: |
          $source = Get-Content desktop\gui\pro-steamid-catalog-source.json -Raw | ConvertFrom-Json
          "commit=$($source.commit)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Checkout professional identity source
        uses: actions/checkout@v6
        with:
          repository: unicbm/CS2-pro-steamid-lib
          ref: ${{ steps.pro-steamid-source.outputs.commit }}
          path: .external/CS2-pro-steamid-lib

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/gui/pnpm-lock.yaml

      - name: Install pinned cs2-lib data dependency
        working-directory: tooling/cs2-lib-data
        run: npm.cmd ci --ignore-scripts

      - name: Check generated cs2-lib econ projection
        working-directory: tooling/cs2-lib-data
        run: npm.cmd run check

      - name: Install desktop dependencies
        working-directory: desktop/gui
        run: pnpm install --frozen-lockfile

      - name: Generate professional identity snapshot
        run: node desktop\gui\scripts\import-pro-steamid-catalog.mjs .external\CS2-pro-steamid-lib

      - name: Check desktop frontend
        working-directory: desktop/gui
        run: pnpm run check

      - name: Test desktop frontend state
        working-directory: desktop/gui
        run: pnpm test

      - name: Build desktop frontend
        working-directory: desktop/gui
        run: pnpm run build:vite

  desktop-rust:
    needs: gate
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore desktop Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: desktop/gui/src-tauri -> target
          shared-key: desktop-debug
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test desktop Rust backend
        working-directory: desktop/gui/src-tauri
        run: cargo test --locked

  css:
    needs: gate
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore NuGet cache
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('server/**/*.csproj', 'server/**/*.props', 'server/**/*.targets') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Build and test CSS plugin
        shell: pwsh
        run: tooling\scripts\test-css.ps1

  native-windows:
    needs: gate
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure native replay safety tests
        run: cmake -S server\runtime\BotController\tests -B server\runtime\BotController\out\replay-safety-ci -A x64

      - name: Build native replay safety tests
        run: cmake --build server\runtime\BotController\out\replay-safety-ci --config Release

      - name: Test native replay safety
        run: ctest --test-dir server\runtime\BotController\out\replay-safety-ci -C Release --output-on-failure

  native-fuzz-smoke:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure production replay ABI fuzz target
        run: >-
          cmake -S server/runtime/BotController/tests
          -B server/runtime/BotController/out/replay-abi-fuzz-ci
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER=clang++
          -DBOTCONTROLLER_BUILD_FUZZER=ON

      - name: Build native replay tests and fuzz target
        run: cmake --build server/runtime/BotController/out/replay-abi-fuzz-ci --config RelWithDebInfo

      - name: Test native replay safety under Clang
        run: >-
          ctest --test-dir server/runtime/BotController/out/replay-abi-fuzz-ci
          --output-on-failure

      - name: Smoke fuzz production replay ABI validator
        timeout-minutes: 2
        run: >-
          server/runtime/BotController/out/replay-abi-fuzz-ci/BotControllerReplayAbiFuzz
          -runs=2000
          -max_len=4096
          -rss_limit_mb=1024
          -print_final_stats=1

  validate:
    name: validate
    if: ${{ always() }}
    needs:
      - gate
      - converter
      - frontend
      - desktop-rust
      - css
      - native-windows
      - native-fuzz-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Require every CI job to pass
        if: >-
          ${{
            needs.gate.result != 'success' ||
            needs.converter.result != 'success' ||
            needs.frontend.result != 'success' ||
            needs.desktop-rust.result != 'success' ||
            needs.css.result != 'success' ||
            needs.native-windows.result != 'success' ||
            needs.native-fuzz-smoke.result != 'success'
          }}
        run: exit 1

      - name: CI complete
        run: echo "All CI jobs passed."
