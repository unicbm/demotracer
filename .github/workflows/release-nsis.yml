name: Release NSIS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-nsis-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  build-windows-nsis:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Read professional identity source pin
        id: pro-steamid-source
        shell: pwsh
        run: |
          $source = Get-Content desktop\gui\pro-steamid-catalog-source.json -Raw | ConvertFrom-Json
          "commit=$($source.commit)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Checkout professional identity source
        uses: actions/checkout@v7
        with:
          repository: unicbm/CS2-pro-steamid-lib
          ref: ${{ steps.pro-steamid-source.outputs.commit }}
          path: .external/CS2-pro-steamid-lib

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore desktop Release cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.9.1
        with:
          workspaces: desktop/gui/src-tauri -> target
          shared-key: desktop-release

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/gui/pnpm-lock.yaml

      - name: Install desktop dependencies
        working-directory: desktop/gui
        run: pnpm install --frozen-lockfile

      - name: Generate professional identity snapshot
        run: node desktop\gui\scripts\import-pro-steamid-catalog.mjs .external\CS2-pro-steamid-lib

      - name: Build Windows NSIS installer
        working-directory: desktop/gui
        run: pnpm run tauri:build --target x86_64-pc-windows-msvc -- --locked

      - name: Record exact component sources
        shell: pwsh
        run: |
          $installerDir = 'desktop/gui/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis'
          if (-not @(Get-ChildItem -LiteralPath $installerDir -Filter '*.exe' -File).Count) {
            throw 'NSIS installer not found'
          }
          tooling/scripts/write-component-manifest.ps1 -OutputPath "$installerDir/component-sources.json"

      - name: Upload unsigned NSIS installer
        uses: actions/upload-artifact@v7
        with:
          name: demotracer-gui-${{ github.ref_name }}-windows-x64
          path: |
            desktop/gui/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            desktop/gui/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/component-sources.json
          if-no-files-found: error
          compression-level: 0
