name: Bot Randomizer data maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: bot-randomizer-data
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Generate and validate latest data candidate
        shell: pwsh
        run: tooling/cs2-lib-data/update.ps1 -ReportPath tmp/randomizer-maintenance/report.json
      - name: Validate consumer builds and lease lifecycle
        shell: pwsh
        run: tooling/scripts/test-css.ps1
      - name: Validate release contract
        shell: pwsh
        run: tooling/scripts/check-release-contract.ps1
      - name: Save review patch and summary
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tmp/randomizer-maintenance | Out-Null
          git diff --binary --output=tmp/randomizer-maintenance/candidate.patch -- tooling/cs2-lib-data shared/econ server/runtime/BotRandomizer/cosmetic_catalog.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path tmp/randomizer-maintenance/report.json) {
            $report = Get-Content tmp/randomizer-maintenance/report.json -Raw | ConvertFrom-Json
            "Data: $($report.previousVersion) -> $($report.candidateVersion)." >> $env:GITHUB_STEP_SUMMARY
            "Upstream source changed since review: $($report.upstreamChanged)." >> $env:GITHUB_STEP_SUMMARY
            "Review source: $($report.upstreamUrl)" >> $env:GITHUB_STEP_SUMMARY
            "Candidate only. Require all checks, provider version bump and game smoke tests before release. No commits, PRs or releases are created." >> $env:GITHUB_STEP_SUMMARY
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: randomizer-maintenance-candidate
          path: tmp/randomizer-maintenance/
          retention-days: 14
