name: Update dependencies

on:
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Inspect updates without creating branches or PRs
        type: boolean
        default: false
      debug:
        description: Include dependency resolution and GitHub API diagnostics
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dependency-updates
  cancel-in-progress: false

jobs:
  renovate:
    if: github.repository == 'unicbm/demotracer' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      statuses: write
      checks: read
    steps:
      - name: Enable dry run
        if: inputs.dry_run
        run: echo 'RENOVATE_DRY_RUN=full' >> "$GITHUB_ENV"
      - uses: renovatebot/github-action@6d26fcf0275dc65624cbc3d51fe78bc773f98321 # v46.3.6
        with:
          token: ${{ github.token }}
          renovate-version: 44.132.2
        env:
          LOG_LEVEL: ${{ inputs.debug && 'debug' || 'info' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_USERNAME: github-actions[bot]
          RENOVATE_GIT_AUTHOR: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          RENOVATE_ALLOWED_COMMANDS: >-
            ["^node server/runtime/common/tools/cs2-lib-data/update\\.mjs --version [0-9]+\\.[0-9]+\\.[0-9]+$",
            "^cargo update --workspace --manifest-path desktop/converter/Cargo\\.toml$",
            "^cargo update --workspace --manifest-path desktop/gui/src-tauri/Cargo\\.toml$"]
