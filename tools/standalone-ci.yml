name: BotRandomizer
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unified-provider:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Test random defaults, Panel controls, plans and data
        shell: pwsh
        run: tools/test.ps1
      - name: Package single provider and shared API
        shell: pwsh
        run: tools/package.ps1
      - name: Validate installable package
        shell: pwsh
        run: tools/test-package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: BotRandomizer
          path: |
            dist/BotRandomizer-v*.zip
            dist/BotRandomizer-v*.zip.sha256
