[package]
name = "cs2-demotracer"
version = "1.5.0"
edition = "2021"
license-file = "LICENSE"
publish = false

[features]
default = ["demoparser"]
demoparser = ["dep:ahash", "dep:parser"]

[lib]
name = "cs2_demotracer"
path = "src/lib.rs"

[dependencies]
ahash = { version = "0.8.12", optional = true, default-features = false, features = ["std", "no-rng"] }
brotli = "8.0.4"
rayon = "1.12"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "1.0.69"
zstd = { version = "0.14.0", default-features = false }

[dependencies.parser]
path = "../../third_party/demoparser/src/parser"
optional = true

[dev-dependencies]
tempfile = "3.27.0"
