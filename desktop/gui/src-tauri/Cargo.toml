[package]
name = "cs2-demotracer-gui"
version = "1.1.7"
description = "Tauri desktop interface for CS2 DemoTracer"
edition = "2021"
license-file = "../../../LICENSE"
publish = false

[lib]
name = "cs2_demotracer_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cs2-demotracer-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
cs2-demotracer = { path = "../../converter", default-features = false, features = ["demoparser"] }
base64 = "=0.22.1"
minisign-verify = "=0.2.5"
rfd = "=0.15.4"
quick-xml = { version = "=0.39.4", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = ["unstable"] }
tauri-plugin-process = "=2.3.1"
tauri-plugin-updater = "=2.10.1"
semver = "=1.0.27"
url = "=2.5.7"
uuid = { version = "=1.23.4", features = ["v4"] }
zip = { version = "=6.0.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    "Win32_System_Diagnostics_ToolHelp",
] }

# The desktop ships as a standalone Windows executable. Optimize the actual
# binary rather than relying on archive compression around an oversized build.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false
