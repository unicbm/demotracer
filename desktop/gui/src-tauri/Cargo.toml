[package]
name = "cs2-demotracer-gui"
version = "1.5.6"
description = "Tauri desktop interface for CS2 DemoTracer"
edition = "2021"
license-file = "../../../LICENSE"
publish = false

[lib]
name = "cs2_demotracer_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cs2-demotracer-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
cs2-demotracer = { path = "../../converter" }
base64 = "=0.23.1"
minisign-verify = "=0.3.0"
rfd = "=0.17.2"
quick-xml = { version = "=0.42.0", features = ["serialize"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "=0.11.0"
tauri = { version = "=2.11.6", features = ["unstable"] }
tauri-plugin-process = "=2.3.1"
tauri-plugin-updater = "=2.12.0"
semver = "=1.0.28"
url = "=2.5.8"
uuid = { version = "=1.26.1", features = ["v4"] }
zip = { version = "=6.0.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tauri-plugin-log = "=2.8.0"
notify = "=8.2.0"
log = "=0.4.33"
chrono = "=0.4.45"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    "Win32_System_Diagnostics_ToolHelp",
] }

# Demo parsing runs inside this binary. Keep its hot loops optimized for speed;
# size-oriented optimization also applies to the converter and parser dependencies.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false
